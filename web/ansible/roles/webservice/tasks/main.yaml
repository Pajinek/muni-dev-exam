---
- name: Configure apache2 vhost
  template:
    src: "http.conf.j2"
    dest: "/etc/apache2/sites-enabled/{{ http_port }}-{{ proj | replace('_', '-') }}.conf"
    mode: "0644"
  tags:
    - httpd

- name: Reload apache2
  systemd:
    state: reloaded
    name: apache2
  tags:
    - restart

- name: Show log instance of {{ proj }}
  command: docker logs {{ proj }}.prod
  register: result
  tags:
    - log

- debug: var=result.stderr_lines
  tags:
    - log
