<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin pavelstudenik@gmail.com
	ServerName muni-exam.brno.pavelstudenik.cz

	Alias /static/ /var/www/muni_exam/static/
	<Directory /var/www/muni_exam/static/>
		Options -Indexes +FollowSymLinks
		Require all granted
	</Directory>

	Alias /storage/ /var/www/muni_exam/storage/
	<Directory /var/www/muni_exam/storage/>
		Options -Indexes +FollowSymLinks
		Require all granted
	</Directory>

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyErrorOverride Off

	<IfModule mod_headers.c>
		RequestHeader set X-Forwarded-Proto "https" early
		RequestHeader set X-Forwarded-Port "443" early
		RequestHeader set X-Forwarded-Ssl "on" early
	</IfModule>

	ProxyPass /static !
	ProxyPass /storage !
	ProxyPass / http://127.0.0.1:8010/
	ProxyPassReverse / http://127.0.0.1:8010/

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/muni-exam.brno.pavelstudenik.cz/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/muni-exam.brno.pavelstudenik.cz/privkey.pem
</VirtualHost>
</IfModule>
